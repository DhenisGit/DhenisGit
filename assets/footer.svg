<svg viewBox="140 0 1000 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gracias por llegar hasta aqui. Escribeme por donde prefieras.">
  <desc>Banda de cierre: una senal recorre la linea superior y el resplandor respira.</desc>
  <defs>
    <pattern id="fGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#58A6FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="fGlow" cx="50%" cy="125%" r="60%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fPulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#58A6FF" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#9A63FF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9A63FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="fFrame"><rect x="140" y="0" width="1000" height="96" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#fFrame)">
    <rect x="140" y="0" width="1000" height="96" fill="#0D1117"/>
    <rect x="140" y="0" width="1000" height="96" fill="url(#fGrid)"/>
    <ellipse cx="640" cy="96" rx="430" ry="80" fill="url(#fGlow)">
      <animate attributeName="rx" values="430;490;430" dur="13s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="240" y="26" width="800" height="1" fill="#21262D"/>
    <rect x="240" y="24.5" width="150" height="4" rx="2" fill="url(#fPulse)">
      <animate attributeName="x" values="180;890;180" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
    </rect>
    <text x="640" y="62" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" fill="#C9D1D9">Gracias por llegar hasta aqu&#237;.</text>
    <text x="640" y="84" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="12" letter-spacing="3" fill="#6E7681">ESCR&#205;BEME POR DONDE PREFIERAS</text>
    <circle cx="300" cy="70" r="1.8" fill="#58A6FF" opacity="0.24"><animate attributeName="opacity" values="0.24;0.08;0.24" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="990" cy="52" r="2" fill="#9A63FF" opacity="0.22"><animate attributeName="opacity" values="0.22;0.07;0.22" dur="6.1s" repeatCount="indefinite"/></circle>
  </g>
</svg>